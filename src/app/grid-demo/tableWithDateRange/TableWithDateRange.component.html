<div class="table-with-date-picker-container">
    <button mat-raised-button [matMenuTriggerFor]="dateMenu" class="date-picker-button"> {{ buttonLabel }} </button>
    <mat-menu #dateMenu="matMenu" class="datepicker-menu">
        <div (click)="$event.stopPropagation()">
            <app-date-range-picker (rangeSelected)="onRangeSelected($event)" />
        </div>
        <!-- <div class="menu-content" (click)="$event.stopPropagation()">
            <mat-form-field appearance="outline">
                <mat-label>Enter a date range</mat-label>
                <mat-date-range-input [formGroup]="range" [rangePicker]="picker">
                    <input matStartDate formControlName="start" placeholder="Start date">
                    <input matEndDate formControlName="end" placeholder="End date" (dateChange)="onDateChange()">
                </mat-date-range-input>
                <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-date-range-picker #picker></mat-date-range-picker>
            </mat-form-field>
            <button mat-button (click)="clearFilter()">Clear</button>
        </div> -->
    </mat-menu>
    <div class="mat-elevation-z8 table-container">
        <table mat-table [dataSource]="dataSource" class="table-style">
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef class="table-header-cell-style"> ID </th>
                <td mat-cell *matCellDef="let element" class="table-cell-style"> {{element.id}} </td>
            </ng-container>
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef class="table-header-cell-style"> Name </th>
                <td mat-cell *matCellDef="let element" class="table-cell-style"> {{element.name}} </td>
            </ng-container>
            <ng-container matColumnDef="date">
                <th mat-header-cell *matHeaderCellDef class="table-header-cell-style"> Date </th>
                <td mat-cell *matCellDef="let element" class="table-cell-style"> {{element.date | date}} </td>
            </ng-container>
            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef class="table-header-cell-style"> Status </th>
                <td mat-cell *matCellDef="let element" class="table-cell-style"> {{element.status}} </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns" class="table-header-row-style"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row-style"></tr>
        </table>
        <mat-paginator [pageSizeOptions]="[5, 10, 20]" pageSize="10" showFirstLastButtons />
    </div>
</div>
