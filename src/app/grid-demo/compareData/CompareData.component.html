<div class="compare-data-container">
    <div class="compare-table-container table1-border">
        <div class="heading">
            <h1>Table 1</h1>
            <button mat-raised-button [matMenuTriggerFor]="dateMenu1" #trigger1="matMenuTrigger"
                class="date-picker-button">
                {{ buttonLabel1 || 'Select Date Range' }}
            </button>
            <mat-menu #dateMenu1="matMenu" class="datepicker-menu">
                <div (click)="$event.stopPropagation()">
                    <app-date-range-picker (rangeSelected)="onRangeSelected1($event)" />
                </div>
            </mat-menu>
        </div>
        <div class="mat-elevation-z8 table-container">
            <table mat-table [dataSource]="dataSource1" class="table-style">
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef class="table-header-cell-style"> ID </th>
                    <td mat-cell *matCellDef="let element" class="table-cell-style"> {{element.id}} </td>
                </ng-container>
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef class="table-header-cell-style"> Name </th>
                    <td mat-cell *matCellDef="let element" class="table-cell-style"> {{element.name}} </td>
                </ng-container>
                <ng-container matColumnDef="date">
                    <th mat-header-cell *matHeaderCellDef class="table-header-cell-style"> Date </th>
                    <td mat-cell *matCellDef="let element" class="table-cell-style"> {{element.date | date}} </td>
                </ng-container>
                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef class="table-header-cell-style"> Status </th>
                    <td mat-cell *matCellDef="let element" class="table-cell-style"> {{element.status}} </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns1" class="table-header-row-style"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns1;" class="table-row-style"></tr>
            </table>
            <mat-paginator #paginator1 [pageSizeOptions]="[5, 10, 20]" pageSize="10" showFirstLastButtons />
        </div>
    </div>
    <div class="compare-table-container table2-border">

            <h1>Table 2</h1>

</div>
