<div class="recipeBookContainer">
    <h1>Recipe Book</h1>
    <form class="searchForm" (submit)="onSearch(); $event.preventDefault()">
        <label>Search for a recipe by name:</label>
        <div class="searchRow">
            <input type="text" [(ngModel)]="searchTerm" name="q" placeholder="Search for a recipe..." />
            <button nbButton outline status="primary" (click)="onSearch()">Search</button>
        </div>
    </form>

    <div *ngIf="loading">Loading recipes…</div>
    <div *ngIf="error" class="error">{{ error }}</div>
    <div *ngIf="!loading && recipes.length === 0 && !error">No recipes found.</div>

    <div *ngIf="recipes.length > 0" class="recipeBookResult">
        <h2>Search Results:</h2>
        <div class="recipeCards">
            <article class="recipeCard" *ngFor="let r of recipes; let i = index">
                <img *ngIf="r.thumb" [src]="r.thumb" [alt]="r.name" />
                <h3>{{ r.name }}</h3>
                <div class="meta">{{ r.category }} • {{ r.area }}</div>
                <details>
                    <summary>Ingredients ({{ r.ingredients.length }})</summary>
                    <ul>
                        <li *ngFor="let ing of r.ingredients">{{ ing.measure }} {{ ing.name }}</li>
                    </ul>
                </details>
                <details>
                    <summary>Instructions</summary>
                    <p class="instructions">{{ r.instructions }}</p>
                </details>
                <a *ngIf="r.youtube" [href]="r.youtube" target="_blank" rel="noreferrer">Watch video</a>
            </article>

        </div>
    </div>
</div>
